name: Deploy the atlas

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'   # daily, so the almanac snapshot follows grain
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Pages must be set to "Source: GitHub Actions" in Settings -> Pages first;
      # the workflow token cannot create or reconfigure the Pages site itself.
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Snapshot grain (tree, stamps, headers, links)
        run: npm run data:almanac
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
